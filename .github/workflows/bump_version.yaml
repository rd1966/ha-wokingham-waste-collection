name: Bump Manifest Version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Bump Manifest Version
        uses: mdegat01/bump-homeassistant-manifest-version@v1.1.0
        with:
          # Points directly to your custom components integration directory
          path: "custom_components/wokingham_waste_collection"
          # Automatically extracts the version number from your release tag (e.g. v0.0.4 -> 0.0.4)
          version: ${{ github.event.release.tag_name }}

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump manifest version to ${{ github.event.release.tag_name }} [skip ci]"
          file_pattern: "custom_components/wokingham_waste_collection/manifest.json"