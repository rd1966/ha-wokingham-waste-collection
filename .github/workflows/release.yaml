name: Bump Manifest Version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Bump Manifest Version
        uses: mofb/bump-homeassistant-manifest-version@v1.1.0
        with:
          # Automatically strips the 'v' from tag 'v0.0.3' to write '0.0.3' inside manifest.json
          version: ${{ github.event.release.tag_name }}

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump manifest version to ${{ github.event.release.tag_name }} [skip ci]"
          file_pattern: "custom_components/wokingham_waste_collection/manifest.json"